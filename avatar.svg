<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="320"
  height="320"
  viewBox="0 0 320 320"
  role="img"
  aria-label="Avatar placeholder"
>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0b122a"/>

  <!-- Head -->
  <circle
    cx="160"
    cy="110"
    r="60"
    fill="#020617"
    stroke="#1f2937"
    stroke-width="2"
  />

  <!-- Body -->
  <rect
    x="40"
    y="180"
    width="240"
    height="110"
    rx="12"
    fill="#020617"
    stroke="#1f2937"
    stroke-width="2"
  />

  <!-- Initials -->
  <text
    x="160"
    y="140"
    text-anchor="middle"
    fill="#38bdf8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="72"
    dominant-baseline="middle"
  >
    MD
  </text>

  <!-- Image (optionnelle, remplace le rectangle si besoin) -->
  <image
    x="40"
    y="180"
    width="240"
    height="110"
    href="./moustaphaDrame.png"
    preserveAspectRatio="xMidYMid slice"
  />

</svg>
